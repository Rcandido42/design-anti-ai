<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sloppy AI Dashboard</title>
  <style>
    .blob {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, transparent 70%);
      filter: blur(80px);
    }
    .title {
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      backdrop-filter: blur(24px);
      border-radius: 32px;
      outline: none;
    }
    .btn {
      border-radius: 9999px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="blob"></div>
  <div class="card">
    <div class="badge">✨ AI Powered Supercharge v2.0 🚀</div>
    <h1 class="title">Seamlessly Unleash Next-Gen Velocity</h1>
    <p>Revolutionary smart intelligence engineered for modern workflows.</p>
    <div class="card">
      <div class="card">
        <button class="btn">Explore Magic ✨</button>
        <button class="btn">Start Journey 🚀</button>
      </div>
    </div>
  </div>
</body>
</html>
