<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Infrastructure Console</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --accent: #10b981;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }
    .btn-primary {
      background: #f4f4f5;
      color: #09090b;
      border-radius: 6px;
      padding: 8px 14px;
    }
    .btn-primary:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Cluster Telemetry</h1>
    <p>Real-time metrics for worker nodes across 3 availability zones.</p>
    <button class="btn-primary">Deploy Revision</button>
  </main>
</body>
</html>
